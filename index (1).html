<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Трекер привычек</title>
  <style>
    :root{
      --bg:#f5f7fb;--panel:#fff;--text:#172033;--muted:#7a8499;--line:#e7ebf2;
      --accent:#6c63ff;--accent2:#8b83ff;--good:#25b46b;--danger:#e05252;
      --shadow:0 18px 60px rgba(26,37,64,.10);--radius:24px;
    }
    *{box-sizing:border-box}
    html{color-scheme:light}
    body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#f7f8fc 0%,#eef2f8 100%);color:var(--text);min-height:100vh}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .wrap{max-width:1120px;margin:0 auto;padding:28px 18px 56px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
    .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:24px}
    .logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),#9e78ff);box-shadow:0 10px 25px rgba(108,99,255,.28)}
    .today{color:var(--muted);font-size:14px;margin-top:4px;font-weight:500}
    .btn{border:0;border-radius:14px;padding:11px 14px;background:#fff;color:var(--text);box-shadow:0 4px 18px rgba(32,42,71,.08);font-weight:700}
    .btn.primary{background:var(--accent);color:#fff;box-shadow:0 10px 24px rgba(108,99,255,.28)}
    .grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.8fr);gap:22px}
    .card{background:rgba(255,255,255,.93);border:1px solid rgba(255,255,255,.7);border-radius:var(--radius);box-shadow:var(--shadow)}
    .main{padding:24px}
    .side{padding:22px;height:max-content}
    .section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .section-title h2{font-size:20px;margin:0}
    .progress{height:10px;background:#edf0f6;border-radius:99px;overflow:hidden;margin:14px 0 22px}
    .progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#9d83ff);border-radius:inherit;transition:width .25s ease}
    .summary{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
    .big{font-size:44px;line-height:1;font-weight:850;letter-spacing:-2px}
    .muted{color:var(--muted)}
    .habits{display:flex;flex-direction:column;gap:12px}
    .habit{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:15px 16px;border:1px solid var(--line);border-radius:18px;background:#fff;transition:.2s ease}
    .habit:hover{transform:translateY(-1px);box-shadow:0 8px 26px rgba(31,43,77,.08)}
    .check{width:44px;height:44px;border-radius:14px;border:2px solid #d9deea;background:#fff;display:grid;place-items:center;font-size:22px;color:transparent;transition:.2s ease}
    .habit.done .check{background:var(--good);border-color:var(--good);color:#fff}
    .habit.done .habit-name{text-decoration:line-through;color:#8c95a8}
    .habit-name{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .habit-meta{font-size:12px;color:var(--muted);margin-top:4px}
    .dots{border:0;background:transparent;color:#8a93a6;font-size:22px;padding:8px;border-radius:10px}
    .dots:hover{background:#f3f5f9}
    .empty{padding:34px 18px;text-align:center;border:1px dashed #d8deea;border-radius:18px;color:var(--muted)}
    .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
    .stat{padding:16px;border-radius:18px;background:#f7f8fb;border:1px solid var(--line)}
    .stat b{display:block;font-size:26px;margin-bottom:4px}
    .heat h3,.tips h3{font-size:15px;margin:4px 0 12px}
    .days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
    .day{aspect-ratio:1;border-radius:9px;background:#edf0f5;display:grid;place-items:center;font-size:11px;color:#748095;font-weight:700}
    .day.l1{background:#dcd9ff;color:#5e56c9}.day.l2{background:#aaa4ff;color:#fff}.day.l3{background:#766dff;color:#fff}.day.today{outline:2px solid #3d35c7;outline-offset:2px}
    .tip{font-size:13px;line-height:1.5;color:var(--muted);padding:14px;border-radius:16px;background:#fafbfc;border:1px solid var(--line)}
    .modal{position:fixed;inset:0;background:rgba(15,23,42,.38);backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
    .modal.open{display:flex}
    .dialog{width:min(460px,100%);background:#fff;border-radius:24px;padding:22px;box-shadow:0 28px 90px rgba(15,23,42,.25)}
    .dialog h3{margin:0 0 18px;font-size:22px}
    .field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:700;color:#5f6a80;margin-bottom:7px}.field input,.field select{width:100%;padding:12px 13px;border:1px solid #dfe4ec;border-radius:13px;outline:none;background:#fff}.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,99,255,.12)}
    .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
    .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#172033;color:#fff;padding:11px 16px;border-radius:13px;font-size:14px;transition:.25s ease;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:820px){.grid{grid-template-columns:1fr}.side{order:-1}.stat-grid{grid-template-columns:repeat(4,1fr)}.stat{padding:12px}.stat b{font-size:22px}}
    @media(max-width:560px){.wrap{padding:18px 12px 36px}.top{align-items:flex-start}.brand{font-size:20px}.main,.side{padding:17px}.summary{align-items:center}.big{font-size:36px}.stat-grid{grid-template-columns:1fr 1fr}.habit{padding:13px}.check{width:40px;height:40px}}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <div class="brand"><span class="logo">✓</span><span>Мои привычки</span></div>
        <div class="today" id="todayText"></div>
      </div>
      <button class="btn primary" id="addBtn">＋ Новая привычка</button>
    </header>

    <div class="grid">
      <main class="card main">
        <div class="section-title"><h2>Сегодня</h2><span class="muted" id="counter">0 из 0</span></div>
        <div class="summary"><div><div class="big" id="percent">0%</div><div class="muted">выполнено сегодня</div></div><div class="muted" id="motivation">Начни с малого ✨</div></div>
        <div class="progress"><i id="progressBar"></i></div>
        <div class="habits" id="habitList"></div>
      </main>

      <aside class="card side">
        <div class="section-title"><h2>Статистика</h2></div>
        <div class="stat-grid">
          <div class="stat"><b id="streakNow">0</b><span class="muted">дней подряд</span></div>
          <div class="stat"><b id="streakBest">0</b><span class="muted">лучший стрик</span></div>
          <div class="stat"><b id="doneTotal">0</b><span class="muted">отметок</span></div>
          <div class="stat"><b id="habitsCount">0</b><span class="muted">привычек</span></div>
        </div>
        <div class="heat"><h3>Последние 7 дней</h3><div class="days" id="week"></div></div>
        <div class="tips" style="margin-top:20px"><h3>Подсказка</h3><div class="tip">Не стремись к идеалу. Стабильные маленькие действия обычно работают лучше редких рывков.</div></div>
      </aside>
    </div>
  </div>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle">Новая привычка</h3>
      <div class="field"><label for="habitName">Название</label><input id="habitName" maxlength="50" placeholder="Например: Читать 20 минут" /></div>
      <div class="field"><label for="habitIcon">Иконка</label><select id="habitIcon"><option>📚</option><option>💧</option><option>🏃</option><option>🧘</option><option>💪</option><option>🥗</option><option>😴</option><option>✍️</option><option>🎯</option><option>🧠</option></select></div>
      <div class="actions"><button class="btn" id="cancelBtn">Отмена</button><button class="btn primary" id="saveBtn">Добавить</button></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
(() => {
  const KEY='habit-tracker-single-file-v1';
  const $=s=>document.querySelector(s);
  const dateKey=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
  const today=dateKey(new Date());
  const defaultData={habits:[
    {id:crypto.randomUUID?.()||String(Date.now()+1),name:'Выпить 2 л воды',icon:'💧',created:today},
    {id:crypto.randomUUID?.()||String(Date.now()+2),name:'Читать 20 минут',icon:'📚',created:today},
    {id:crypto.randomUUID?.()||String(Date.now()+3),name:'Прогулка 30 минут',icon:'🏃',created:today}
  ],checks:{}};
  let data=load();

  function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return v&&Array.isArray(v.habits)&&v.checks?v:defaultData}catch{return defaultData}}
  function save(){localStorage.setItem(KEY,JSON.stringify(data))}
  function checked(id,day=today){return !!(data.checks[day]&&data.checks[day][id])}
  function toggle(id){data.checks[today]=data.checks[today]||{};data.checks[today][id]=!data.checks[today][id];save();render()}
  function deleteHabit(id){if(!confirm('Удалить эту привычку? История её отметок тоже перестанет учитываться.'))return;data.habits=data.habits.filter(h=>h.id!==id);for(const day of Object.keys(data.checks)) delete data.checks[day][id];save();render();toast('Привычка удалена')}

  function dayScore(day){if(!data.habits.length)return 0;const valid=data.habits.filter(h=>h.created<=day);if(!valid.length)return 0;const done=valid.filter(h=>checked(h.id,day)).length;return done/valid.length}
  function allDone(day){const valid=data.habits.filter(h=>h.created<=day);return valid.length>0&&valid.every(h=>checked(h.id,day))}
  function streaks(){
    let current=0,best=0,run=0;
    const first=new Date();first.setDate(first.getDate()-365);
    for(let d=new Date(first);dateKey(d)<=today;d.setDate(d.getDate()+1)){
      if(allDone(dateKey(d))){run++;best=Math.max(best,run)}else run=0;
    }
    for(let d=new Date();;d.setDate(d.getDate()-1)){if(allDone(dateKey(d)))current++;else break}
    return {current,best};
  }
  function totalChecks(){let n=0;for(const day of Object.values(data.checks))for(const v of Object.values(day))if(v)n++;return n}

  function render(){
    const list=$('#habitList');list.innerHTML='';
    if(!data.habits.length){list.innerHTML='<div class="empty">Пока нет привычек.<br>Добавь первую — и начни сегодня.</div>'}
    for(const h of data.habits){
      const el=document.createElement('div');el.className='habit'+(checked(h.id)?' done':'');
      el.innerHTML=`<button class="check" aria-label="Отметить привычку">✓</button><div><div class="habit-name">${escapeHtml(h.icon+'  '+h.name)}</div><div class="habit-meta">Ежедневно</div></div><button class="dots" aria-label="Удалить">⋯</button>`;
      el.querySelector('.check').onclick=()=>toggle(h.id); el.querySelector('.dots').onclick=()=>deleteHabit(h.id); list.appendChild(el);
    }
    const done=data.habits.filter(h=>checked(h.id)).length,total=data.habits.length,pct=total?Math.round(done/total*100):0;
    $('#counter').textContent=`${done} из ${total}`;$('#percent').textContent=pct+'%';$('#progressBar').style.width=pct+'%';
    $('#motivation').textContent=pct===100&&total?'Готово на сегодня 🎉':pct>=60?'Отличный темп 🔥':pct>0?'Продолжай — уже начато 💪':'Начни с малого ✨';
    const s=streaks();$('#streakNow').textContent=s.current;$('#streakBest').textContent=s.best;$('#doneTotal').textContent=totalChecks();$('#habitsCount').textContent=total;
    renderWeek();
  }
  function renderWeek(){const box=$('#week');box.innerHTML='';const fmt=new Intl.DateTimeFormat('ru-RU',{weekday:'short'});for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dateKey(d),sc=dayScore(k);const el=document.createElement('div');el.className='day '+(sc===1?'l3':sc>=.5?'l2':sc>0?'l1':'')+(k===today?' today':'');el.title=`${k}: ${Math.round(sc*100)}%`;el.textContent=fmt.format(d).replace('.','');box.appendChild(el)}}
  function openModal(){const m=$('#modal');m.classList.add('open');m.setAttribute('aria-hidden','false');$('#habitName').value='';setTimeout(()=>$('#habitName').focus(),20)}
  function closeModal(){const m=$('#modal');m.classList.remove('open');m.setAttribute('aria-hidden','true')}
  function addHabit(){const name=$('#habitName').value.trim();if(!name){toast('Введите название привычки');return}const id=crypto.randomUUID?.()||String(Date.now());data.habits.push({id,name,icon:$('#habitIcon').value,created:today});save();closeModal();render();toast('Привычка добавлена')}
  function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1800)}
  function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}

  $('#todayText').textContent=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(new Date());
  $('#addBtn').onclick=openModal;$('#cancelBtn').onclick=closeModal;$('#saveBtn').onclick=addHabit;$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
  $('#habitName').addEventListener('keydown',e=>{if(e.key==='Enter')addHabit();if(e.key==='Escape')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
  render();
})();
</script>
</body>
</html>
